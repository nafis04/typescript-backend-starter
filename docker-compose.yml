version: '3.9'

services:
  api:
    build: .

    container_name: task-api

    ports:
      - '5000:5000'

    env_file:
      - .env

    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  postgres:
    image: postgres:16

    container_name: task-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_management

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
